plugins {
    id 'java'
    id 'jacoco'
    // Checks the dependency tree against the National Vulnerability Database. The first run
    // downloads that database, which takes several minutes and needs network access, so it is a
    // separate task rather than part of `check` — a build that cannot run offline is a build
    // that gets skipped.
    id 'org.owasp.dependencycheck' version '10.0.4'
    id 'org.springframework.boot' version '3.4.0'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'


java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    // JWT encoding/decoding and the bearer-token filter, from Spring Security itself
    // (Nimbus JOSE under the hood) instead of a separate third-party JWT library.
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    runtimeOnly 'org.postgresql:postgresql'
    implementation 'org.flywaydb:flyway-core'
    // Flyway 10 moved per-database support into separate modules; flyway-core alone reports
    // "Unsupported Database: PostgreSQL". Version is managed by the Spring Boot BOM.
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'

    // MinIO speaks the S3 API. The AWS SDK keeps the code portable between MinIO locally and
    // real object storage in production, which is the whole reason for using MinIO in dev.
    implementation 'software.amazon.awssdk:s3:2.29.29'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    // Java has no built-in xlsx or PDF support and neither format is reasonable to hand-roll.
    // POI's SXSSF writer streams rows to disk instead of building the whole workbook in memory,
    // which is the property the export requirement actually depends on.
    implementation 'org.apache.poi:poi-ooxml:5.3.0'
    implementation 'org.apache.pdfbox:pdfbox:3.0.3'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'org.springframework.kafka:spring-kafka'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    // Starts a real PostgreSQL in Docker for integration tests and wires Spring Boot's
    // datasource to it via @ServiceConnection, so tests never talk to a shared database.
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'org.testcontainers:minio'
    testImplementation 'org.testcontainers:kafka'
    testImplementation 'org.springframework.kafka:spring-kafka-test'
}

// Code quality baseline (Phase 00): fail loudly on compiler warnings we care about,
// keep parameter names for Spring/Jackson, and always produce a coverage report.
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xlint:all' << '-parameters'
}

tasks.named('test') {
    useJUnitPlatform()

    // Testcontainers looks for the Docker daemon at /var/run/docker.sock by default.
    // Docker Desktop on macOS exposes it under the user's home directory instead, so point
    // the test JVM at it unless the environment already says where Docker lives.
    def dockerSocket = new File(System.getProperty('user.home'), '.docker/run/docker.sock')
    if (System.getenv('DOCKER_HOST') == null && dockerSocket.exists()) {
        environment 'DOCKER_HOST', "unix://${dockerSocket.absolutePath}"
    }

    // docker-java, which Testcontainers uses, asks for Docker API 1.32 by default.
    // Docker Engine 29 refuses anything below 1.40 (HTTP 400 on /v1.32/info), so pin a version
    // both ends support. Remove once the Testcontainers version in use negotiates this itself.
    systemProperty 'api.version', System.getProperty('api.version', '1.44')

    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'full'
    }
    finalizedBy tasks.named('jacocoTestReport')
}

tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test')
    reports {
        xml.required = true
        html.required = true
    }
}

// Coverage floor. Deliberately below the current figures (85% instruction, 70% branch): a gate
// is there to catch a collapse, not to make every small refactor a negotiation. The branch figure
// dropped in Phase 09 because the Kafka publisher and consumers need a broker to exercise; that
// is a real gap, recorded in PROGRESS.md rather than hidden by lowering the bar to nothing.
tasks.register('jacocoCoverageVerification', JacocoCoverageVerification) {
    dependsOn tasks.named('jacocoTestReport')
    violationRules {
        rule {
            limit {
                counter = 'INSTRUCTION'
                minimum = 0.80
            }
        }
        rule {
            limit {
                counter = 'BRANCH'
                minimum = 0.65
            }
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('jacocoCoverageVerification')
}

dependencyCheck {
    // A vulnerability with a CVSS score of 7 or more fails the scan.
    failBuildOnCVSS = 7.0
    formats = ['HTML', 'JSON']
    // The NVD API is rate-limited without a key; supply one in CI.
    nvd {
        apiKey = System.getenv('NVD_API_KEY')
    }
    analyzers {
        // Only the JVM dependencies matter here; the rest only slow the scan down.
        assemblyEnabled = false
        nodeAuditEnabled = false
        retirejs { enabled = false }
    }
}
