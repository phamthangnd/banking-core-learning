plugins {
    id 'java'
    id 'jacoco'
    id 'org.springframework.boot' version '3.4.0'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'


java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    // JWT encoding/decoding and the bearer-token filter, from Spring Security itself
    // (Nimbus JOSE under the hood) instead of a separate third-party JWT library.
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    runtimeOnly 'org.postgresql:postgresql'
    implementation 'org.flywaydb:flyway-core'
    // Flyway 10 moved per-database support into separate modules; flyway-core alone reports
    // "Unsupported Database: PostgreSQL". Version is managed by the Spring Boot BOM.
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'

    // MinIO speaks the S3 API. The AWS SDK keeps the code portable between MinIO locally and
    // real object storage in production, which is the whole reason for using MinIO in dev.
    implementation 'software.amazon.awssdk:s3:2.29.29'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    // Java has no built-in xlsx or PDF support and neither format is reasonable to hand-roll.
    // POI's SXSSF writer streams rows to disk instead of building the whole workbook in memory,
    // which is the property the export requirement actually depends on.
    implementation 'org.apache.poi:poi-ooxml:5.3.0'
    implementation 'org.apache.pdfbox:pdfbox:3.0.3'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'org.springframework.kafka:spring-kafka'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    // Starts a real PostgreSQL in Docker for integration tests and wires Spring Boot's
    // datasource to it via @ServiceConnection, so tests never talk to a shared database.
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'org.testcontainers:minio'
    testImplementation 'org.testcontainers:kafka'
    testImplementation 'org.springframework.kafka:spring-kafka-test'
}

// Code quality baseline (Phase 00): fail loudly on compiler warnings we care about,
// keep parameter names for Spring/Jackson, and always produce a coverage report.
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xlint:all' << '-parameters'
}

tasks.named('test') {
    useJUnitPlatform()

    // Testcontainers looks for the Docker daemon at /var/run/docker.sock by default.
    // Docker Desktop on macOS exposes it under the user's home directory instead, so point
    // the test JVM at it unless the environment already says where Docker lives.
    def dockerSocket = new File(System.getProperty('user.home'), '.docker/run/docker.sock')
    if (System.getenv('DOCKER_HOST') == null && dockerSocket.exists()) {
        environment 'DOCKER_HOST', "unix://${dockerSocket.absolutePath}"
    }

    // docker-java, which Testcontainers uses, asks for Docker API 1.32 by default.
    // Docker Engine 29 refuses anything below 1.40 (HTTP 400 on /v1.32/info), so pin a version
    // both ends support. Remove once the Testcontainers version in use negotiates this itself.
    systemProperty 'api.version', System.getProperty('api.version', '1.44')

    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'full'
    }
    finalizedBy tasks.named('jacocoTestReport')
}

tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test')
    reports {
        xml.required = true
        html.required = true
    }
}
