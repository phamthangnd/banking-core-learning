# Local development profile: verbose enough to learn from, never used in production.
spring:
  jpa:
    properties:
      hibernate:
        # See the SQL Hibernate actually sends. The fastest way to notice an N+1 problem is to
        # watch the same query scroll past once per row.
        format_sql: true
    show-sql: false

bankcore:
  metrics:
    # The local Prometheus container cannot authenticate, and nothing outside this machine can
    # reach the port. In production the management port is bound to an internal interface instead.
    public: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.example.bankcore: DEBUG
    # Uncomment while studying queries:
    # org.hibernate.SQL: DEBUG
    # org.hibernate.orm.jdbc.bind: TRACE
