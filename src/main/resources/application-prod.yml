# Production profile.
# Rules that must never be relaxed here (CLAUDE.md sections 4 and 5):
#   - schema evolution belongs to Flyway, never to Hibernate (ddl-auto=validate)
#   - actuator exposes the minimum surface
#   - health details are never shown to anonymous callers
#   - secrets come from the environment, never from this file
spring:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    validate-on-migrate: true
    baseline-on-migrate: false

  datasource:
    # Credentials come from the environment only. Never commit them.
    url: ${BANKCORE_DB_URL}
    username: ${BANKCORE_DB_USERNAME}
    password: ${BANKCORE_DB_PASSWORD}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

server:
  # Never advertise the server product and version: it tells an attacker which exploits to try.
  server-header:
  error:
    # A stack trace in an error response is a map of the application's internals.
    include-stacktrace: never
    include-message: never
  # Behind a load balancer that terminates TLS, so the application must be told the real scheme
  # before it will emit HSTS or build correct absolute URLs.
  forward-headers-strategy: framework

logging:
  level:
    root: WARN
    com.example.bankcore: INFO
    # Never turn these up in production: they print bound parameter values, which include
    # personal data and, on the auth path, password hashes.
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
