# Automated test profile.
# The datasource is supplied by Testcontainers (@ServiceConnection), so no URL is configured
# here: tests must never be able to reach a developer's or a shared database.
spring:
  main:
    banner-mode: off

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: WARN
    com.example.bankcore: INFO
    org.flywaydb: INFO
