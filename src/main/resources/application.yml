spring:
  application:
    name: bankcore

  profiles:
    default: local

  # UserDetailsService is excluded so Spring Boot never generates and logs a default password
  # (CLAUDE.md section 4: secrets must never reach the logs). Real authentication: Phase 03.
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

  datasource:
    url: ${BANKCORE_DB_URL:jdbc:postgresql://localhost:5432/bankcore}
    username: ${BANKCORE_DB_USERNAME:bankcore}
    password: ${BANKCORE_DB_PASSWORD:bankcore}
    hikari:
      # A connection pool is a queue in front of a scarce resource. These are deliberate,
      # modest defaults; Phase 11 tunes them against measurements rather than guesses.
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000
      pool-name: bankcore-pool

  jpa:
    hibernate:
      # Never 'create' or 'update': Flyway owns the schema, Hibernate only checks that the
      # entity mapping matches it and refuses to start if they disagree.
      ddl-auto: validate
    # Off by design: an open session in the view layer hides lazy loading inside the response
    # rendering, which is where N+1 queries go unnoticed.
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    # Fail instead of "fixing" a drifted schema silently.
    validate-on-migrate: true
    baseline-on-migrate: false

  data:
    redis:
      host: ${BANKCORE_REDIS_HOST:localhost}
      port: ${BANKCORE_REDIS_PORT:6379}
      timeout: 2s

  kafka:
    bootstrap-servers: ${BANKCORE_KAFKA_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      # Every replica must acknowledge, and the producer retries: a lost event is an event that
      # describes something that really happened.
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # Offsets are committed by the container after the listener returns, so a crash mid-work
      # redelivers rather than skips. Consumers deduplicate, which is what makes that safe.
      enable-auto-commit: false
      auto-offset-reset: earliest
    listener:
      ack-mode: record

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  mvc:
    problemdetails:
      enabled: false

  servlet:
    multipart:
      # A hard ceiling in front of the per-category limits: an oversized upload is rejected by
      # the container before the application ever buffers it.
      max-file-size: 20MB
      max-request-size: 25MB

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  info:
    env:
      enabled: true

info:
  app:
    name: BankCore
    phase: "09 - Redis + Kafka + Async Processing"

server:
  port: 8080

# Module settings. Bound to typed records (see CustomerProperties) and validated at startup.
bankcore:
  customer:
    minimum-age-years: 18
    default-page-size: 20
    max-page-size: 100

  # Events are written to the outbox in the same transaction as the change they describe, and a
  # scheduled publisher moves them to Kafka. Turn the whole mechanism off when Kafka is absent.
  events:
    enabled: ${BANKCORE_EVENTS_ENABLED:false}
    publish-interval-ms: 1000
    batch-size: 100
    max-attempts: 5

  redis:
    # Off by default so the application runs without Redis; the in-memory cache and rate limiter
    # stand in. With several instances this must be on, or each keeps its own counters.
    enabled: ${BANKCORE_REDIS_ENABLED:false}

  file:
    endpoint: ${BANKCORE_S3_ENDPOINT:http://localhost:9000}
    bucket: ${BANKCORE_S3_BUCKET:bankcore}
    region: ${BANKCORE_S3_REGION:us-east-1}
    # Credentials come from the environment. The local defaults match docker-compose's MinIO.
    access-key: ${BANKCORE_S3_ACCESS_KEY:minio}
    secret-key: ${BANKCORE_S3_SECRET_KEY:minio123}

  notification:
    email:
      # Off unless a mail server is configured; the logging sender stands in.
      enabled: ${BANKCORE_EMAIL_ENABLED:false}
      from: no-reply@bankcore.local

  account:
    # Every account number starts with this prefix, then a sequence value and a Luhn check digit.
    number-prefix: "9004"
    default-currency: VND
    # Overdrafts are off by default: a positive value here is a deliberate credit decision.
    maximum-overdraft-limit: 0

  auth:
    jwt:
      # No default on purpose. Outside local/test the application refuses to start without it;
      # locally a random key is generated for the run. A committed secret is a public secret.
      secret: ${BANKCORE_JWT_SECRET:}
      issuer: bankcore
      # Short, because an access token is not checked against the database on every request.
      ttl: 15m
    refresh-token:
      # Long-lived but single-use: every refresh rotates it and reuse revokes the whole chain.
      ttl: 30d
    password-reset:
      ttl: 30m
    lockout:
      max-attempts: 5
      duration: 15m
    rate-limit:
      max-attempts: 10
      window: 1m
    password:
      min-length: 12

logging:
  # Every log line carries the correlation id set by CorrelationIdFilter, so a response's
  # traceId leads straight to the log lines of that request.
  pattern:
    level: "%5p [${spring.application.name:bankcore},%X{traceId:-}]"
  level:
    root: INFO
    com.example.bankcore: INFO
