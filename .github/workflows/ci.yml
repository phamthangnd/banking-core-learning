# Build, test and package.
#
# The pipeline's job is to fail before a human has to: compilation, the whole test suite against
# real PostgreSQL and MinIO containers, the coverage gate and the security scan. Anything it lets
# through is something a reviewer has to catch by reading.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The dependency scan runs on a schedule too: a dependency becomes vulnerable while nobody is
  # touching the repository, so waiting for the next push would leave it unnoticed.
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read
  packages: write

concurrency:
  # A new push supersedes the run in progress; nobody needs the results of a commit that has
  # already been replaced.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          # Caches the Gradle dependency cache keyed on the build files.
          cache: gradle

      # Testcontainers needs a Docker daemon; ubuntu-latest has one, so the integration tests run
      # exactly as they do locally rather than against a stubbed database.
      - name: Build, test and verify coverage
        run: ./gradlew --no-daemon build

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            build/reports/tests/test
            build/reports/jacoco/test/html
          retention-days: 7

  dependency-scan:
    name: Dependency vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Does not gate the build on a pull request: the NVD download is slow and a new CVE published
    # overnight would block work unrelated to it. It still fails loudly on main and on schedule.
    if: github.event_name != 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle

      - name: OWASP dependency check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: ./gradlew --no-daemon dependencyCheckAnalyze

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report
          path: build/reports/dependency-check-report.html
          retention-days: 30

  image:
    name: Build and push image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Only after the tests pass, and only for main: an image that was never tested is an image
    # nobody should be able to deploy by accident.
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to the container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # The commit sha is the tag that matters: `latest` cannot identify what is running, and
          # a rollback needs a name for the previous build.
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
